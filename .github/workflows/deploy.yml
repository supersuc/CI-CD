name: Deploy

on:
  # 合并到 main 后自动构建。部署阶段需人工审批，见下方 deploy job
  push:
    branches: [main]
  # 支持手动触发，便于调试
  workflow_dispatch:

# 部署 Pages 需要的权限，缺一不可
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署，避免并发发布互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 阶段一：自动构建，无需人工介入
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: 安装 Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm build-only

      - name: 配置 Pages
        uses: actions/configure-pages@v6

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: 输出构建摘要
        if: always()
        run: |
          {
            echo "## 构建完成，等待人工审批部署"
            echo ""
            echo "| 项目 | 值 |"
            echo "|------|-----|"
            echo "| 版本 | #${{ github.run_number }} |"
            echo "| 提交 | \`${{ github.sha }}\` |"
            echo "| 触发人 | ${{ github.actor }} |"
            echo ""
            echo "**下一步**：需在上方 deploy 作业中点击 Review deployments 批准后才会发布上线。"
          } >> "$GITHUB_STEP_SUMMARY"

  # 阶段二：部署，受环境保护规则约束，需人工审批后才执行
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 记录审批通过
        run: |
          echo "审批已通过，开始部署 ${{ github.sha }}"
          {
            echo "## 审批已通过，正在部署"
            echo ""
            echo "- 审批人: ${{ github.actor }}"
            echo "- 提交: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 部署到 Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: 输出部署结果
        if: always()
        run: |
          {
            echo "## 部署结果"
            echo ""
            echo "- 状态: ${{ job.status }}"
            echo "- 站点: ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
